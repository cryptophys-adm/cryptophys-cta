<!doctype html>
<!-- The share card (owner 2026-11-24, "setuju", the mockup "CTA: share image, llms.txt, War Room tab"): drawn at
     1200 x 630 by scripts/og-image.mjs into public/og.png. The home page's own words only, no price, level or reading,
     so it never goes stale. The ring: the sixteen analysts around the table; the gold sight: the brand mark. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Rajdhani;font-weight:500;src:url(../../public/fonts/rajdhani-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Rajdhani;font-weight:600;src:url(../../public/fonts/rajdhani-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Newsreader;font-weight:400;src:url(../../public/fonts/newsreader-latin-400-normal.woff2) format("woff2")}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;color:#E6EDF7}
.og{position:relative;width:1200px;height:630px;box-sizing:border-box;background:radial-gradient(120% 140% at 82% 50%,#0E1A30 0,#081020 42%,#060A12 70%);display:grid;grid-template-columns:1fr 470px;padding:64px 0 56px 72px}
.brand{display:flex;align-items:center;gap:14px;font:600 30px/1 Rajdhani,sans-serif;letter-spacing:.02em}
.brand svg{width:42px;height:42px;fill:none;stroke:#D4A537;stroke-width:1.6}
.brand small{font:500 24px/1 Rajdhani,sans-serif;color:#8A97AB;margin-left:4px}
h1{font:600 84px/1.0 Rajdhani,sans-serif;margin:74px 0 0;letter-spacing:.004em;max-width:9.2em}
p{font:400 30px/1.4 Newsreader,serif;color:#C9D4E4;margin:26px 0 0;max-width:19em}
.foot{position:absolute;left:72px;bottom:52px;display:flex;gap:28px;font:500 24px/1 Rajdhani,sans-serif;color:#8A97AB}
.foot span:first-child{color:#8FD8FF}
.table{align-self:center;justify-self:center;width:400px;height:400px;margin-top:-10px}
.table svg{width:100%;height:100%}
</style>
</head>
<body>
<div class="og">
  <div>
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 2.5v19M2.5 12h19"/><circle cx="12" cy="12" r="3.2"/></svg><span>XAUUSD AI</span><small>Cryptophys</small></div>
    <h1>Gold, argued every fifteen minutes.</h1>
    <p>Sixteen AI analysts meet when a candle closes, and a moderator writes down what the room concluded.</p>
  </div>
  <div class="table" id="table"></div>
  <div class="foot"><span>cta.cryptophys.work</span><span>Education, not financial advice</span></div>
</div>
<script>
const seats = Array.from({ length: 16 }, (_, i) => { const a = (i / 16) * Math.PI * 2 - Math.PI / 2, x = 200 + Math.cos(a) * 172, y = 200 + Math.sin(a) * 172; return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i % 4 === 0 ? 7 : 5}" fill="${i % 4 === 0 ? '#8FD8FF' : '#3A5578'}"/>`; }).join('');
document.getElementById('table').innerHTML = `<svg viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="172" fill="none" stroke="#1B2840" stroke-width="1.5"/><circle cx="200" cy="200" r="120" fill="#0C1424" stroke="#1B2840"/>${seats}<g fill="none" stroke="#D4A537" stroke-width="3"><circle cx="200" cy="200" r="62"/><path d="M200 120v160M120 200h160"/><circle cx="200" cy="200" r="21"/></g></svg>`;
</script>
</body>
</html>

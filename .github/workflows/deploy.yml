name: Deploy cryptophys-cta

# The bridge deploy of cryptophys-cta (cta.cryptophys.work) until the platform's Forge deploys external organs
# (ADR-0018). Owner 2026-11-16: "setuju, buatkan PR workflow deploy CTA" (the platform session's faster path: the
# Worker must exist before the platform can bind EXT_ORGANISM_CTA and EXT_CRYPTOPHYS_CTA and cover the studio with
# Access). Runs on main and by hand; never `wrangler deploy` by hand.
#
# - Without the repository secret CLOUDFLARE_API_TOKEN, the deploy job is skipped with a warning (main stays green
#   until the owner adds it, then runs this workflow by hand once).
# - It sets no Worker secret: the channels' account tokens are set later through the platform; `wrangler deploy`
#   keeps the secrets a Worker already has.
# - Publishing is off, or on only for the channels PUBLISH_CHANNELS names (owner PR): this workflow refuses otherwise
#   (turning it on is its own owner PR, which removes that guard in the same change).
# - The health and smoke checks are read from organism.json `deploy` (the same checks the Forge will run).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cta
  cancel-in-progress: false

jobs:
  credentials:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set in this repository's Actions secrets: cryptophys-cta was NOT deployed. Add it, then run this workflow by hand (Actions → Deploy cryptophys-cta → Run workflow)."
            echo "### Not deployed: CLOUDFLARE_API_TOKEN is not set" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: credentials
    if: needs.credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests
        run: node --test test/*.test.mjs

      - name: Publishing stays off
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const cfg = JSON.parse(readFileSync("wrangler.jsonc", "utf8").replace(/^\s*\/\/.*$/gm, ""));
          // Off, or on (an owner PR) for an explicit list of known channels: never on for every channel by default.
          const known = ["threads", "instagram", "x", "telegram", "youtube", "tiktok"];
          const pub = cfg.vars?.CONTENT_PUBLISH, list = String(cfg.vars?.PUBLISH_CHANNELS ?? "").split(",").map((c) => c.trim()).filter(Boolean);
          if (pub === "off") console.log("CONTENT_PUBLISH: off");
          else if (pub === "on" && list.length && list.every((c) => known.includes(c))) console.log(`CONTENT_PUBLISH: on for ${list.join(", ")}`);
          else { console.error(`::error::CONTENT_PUBLISH is "${pub}" with PUBLISH_CHANNELS "${list.join(",")}": refused (off, or on with a named list)`); process.exit(1); }
          NODE

      - name: Install (the lockfile; @cloudflare/puppeteer is bundled into the Worker)
        run: npm ci --no-audit --no-fund

      - name: Validate the Worker bundle
        run: npx --yes wrangler@4.156.2 deploy --dry-run

      # Each version names the commit it was built from (orchestrator, owner 2026-11-24), as the xauusd Workers do, so a
      # version uploaded from outside this workflow shows in the Worker's deployments as one without a commit.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # The tag is also what /health, CtaHealth.health() and the DNA report as the running commit (src/version.mjs).
        run: npx --yes wrangler@4.156.2 deploy --tag "${GITHUB_SHA:0:12}" --message "commit ${GITHUB_SHA}"

      - name: Health and smoke checks (organism.json deploy)
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const { deploy } = JSON.parse(readFileSync("organism.json", "utf8"));
          const origin = `https://${deploy.custom_domains[0]}`;
          const wait = (ms) => new Promise((r) => setTimeout(r, ms));
          const get = (path) => fetch(origin + path, { redirect: "manual", signal: AbortSignal.timeout(20000) });
          // A new custom domain can take a few minutes to answer, and a runner's resolver can hold a "no such host"
          // answer from before the domain existed for up to 30 minutes (the zone's negative-cache time): the first
          // deploy of a new hostname waits up to 35 minutes here. Later deploys answer at once.
          // The live Worker publishes exactly what wrangler.jsonc says: off, or on for the named channels only.
          const want = JSON.parse(readFileSync("wrangler.jsonc", "utf8").replace(/^\s*\/\/.*$/gm, "")).vars ?? {};
          const wantList = want.CONTENT_PUBLISH === "on" ? String(want.PUBLISH_CHANNELS ?? "").split(",").map((c) => c.trim()).filter(Boolean) : [];
          // ...and it is this commit's version: /health's version.tag is the --tag above (src/version.mjs).
          const tag = String(process.env.GITHUB_SHA ?? "").slice(0, 12);
          const matches = (j) => j?.publish === want.CONTENT_PUBLISH && JSON.stringify(j?.publish_channels ?? []) === JSON.stringify(wantList) && j?.version?.tag === tag;
          // Right after a deploy the edge can still answer from the old version for a short while, so a publish
          // mismatch is retried for up to 2 minutes before it fails the run (2026-11-17: #37 failed on the first read).
          let health = null, last = null, mismatches = 0;
          for (let i = 0; i < 70 && !health && mismatches < 12; i++) {
            try {
              const r = await get(`${deploy.health.path}?deploy=${Date.now()}`);
              const j = await r.json().catch(() => null);
              if (r.ok && Object.entries(deploy.health.expect).every(([k, v]) => j?.[k] === v)) {
                last = j;
                if (matches(j)) health = j;
                else { mismatches++; console.log(`health answers with publish ${j.publish} for [${j.publish_channels}] at version ${j.version?.tag}; waiting for [${wantList}] at ${tag}`); }
              } else console.log(`health not ready: HTTP ${r.status}`);
            } catch (e) { console.log(`health: ${e?.cause?.code || e?.cause?.message || e?.name}`); }
            if (!health) await wait(10000);
          }
          if (!health && last) { console.error(`::error::the deployed Worker reports publish ${last.publish} for [${last.publish_channels}] at version ${last.version?.tag}, config says ${want.CONTENT_PUBLISH} for [${wantList}] at ${tag}`); process.exit(1); }
          if (!health) { console.error(`::error::${origin}${deploy.health.path} did not answer as expected`); process.exit(1); }
          console.log(`health: ${JSON.stringify(health)}`);
          let failed = 0;
          for (const s of deploy.smoke) {
            const r = await get(s.path);
            const ok = s.expect_status.includes(r.status);
            console.log(`${ok ? "ok  " : "FAIL"} ${s.path}: HTTP ${r.status} (expected ${s.expect_status.join(" or ")})`);
            if (!ok) failed++;
          }
          if (failed) process.exit(1);
          NODE
